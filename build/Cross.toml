# Bundled SQLite/libavif/libaom need C/C++, CMake and x86 NASM; no GTK/OpenSSL.
# Use the maintained images with cross installed from its official Git source.
# main is mutable; record an image digest when qualifying a release build.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
pre-build = ["apt-get update && apt-get --assume-yes install nasm perl pkg-config"]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = ["apt-get update && apt-get --assume-yes install nasm perl pkg-config"]

[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:main"
pre-build = ["apt-get update && apt-get --assume-yes install nasm perl pkg-config"]
