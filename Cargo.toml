[package]
name = "nabi-view"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
build = "build/cargo.rs"
description = "Local image reader"
license = "MIT"
homepage = "https://lab.saro.me/app/nabi-view"

[workspace]
members = ["platforms/android/rust", "platforms/preview/rust", "vendor/epaint", "vendor/egui-wgpu"]
default-members = ["."]
resolver = "3"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "exr", "hdr", "dds", "ff"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
libavif-sys = { version = "0.17.0", default-features = false, features = ["codec-aom"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
png = "0.18.1"
moxcms = "0.9.2"
half = "2.7.1"
fontdb = "0.24.0"
ttf-parser = "0.25.1"
ab_glyph = "0.2.32"
dirs = "7.0.0"
flate2 = "1.1.11"
kamadak-exif = "0.6.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tempfile = "3.27.0"
zip = { version = "9.5.1", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "ppmd"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate"] }

[dev-dependencies]
# Tests write 7z fixtures; the app only reads archives.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "compress"] }

[profile.release]
strip = "debuginfo"

[build-dependencies]
cc = "1.11.1"

[patch.crates-io]
# Keep Nabi View's text-direction and HDR integration on current upstream crates.
epaint = { path = "vendor/epaint" }
egui-wgpu = { path = "vendor/egui-wgpu" }

[target.'cfg(windows)'.dependencies]
# The latest Windows SDK crate's COM macro requires its matching core ABI.
windows-core = "=0.62.2"
windows = { version = "0.62.2", features = ["Win32_Devices_Display", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(unix)'.dev-dependencies]
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"] }
libc = "0.2.191"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"] }
trash = { version = "5.3.0", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.18.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
