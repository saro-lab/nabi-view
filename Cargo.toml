[package]
name = "nabi-view"
version = "1.0.0"
edition = "2024"
build = "build/cargo.rs"
description = "Local image reader"
license = "MIT"
homepage = "https://lab.saro.me/app/nabi-view"

[workspace]
members = ["platforms/android/rust"]
default-members = ["."]
resolver = "3"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "exr", "hdr", "dds", "ff"] }
jxl-oxide = { version = "=0.12.6", features = ["image"] }
libavif-sys = { version = "=0.17.0", default-features = false, features = ["codec-aom"] }
resvg = { version = "=0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
fontdb = "=0.24.0"
ttf-parser = "=0.25.1"
ab_glyph = "=0.2.32"
dirs = "6.0.0"
flate2 = "1.1.10"
kamadak-exif = "0.6.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tempfile = "3.27.0"

[profile.release]
strip = "debuginfo"

[build-dependencies]
cc = "1.11.0"

[patch.crates-io]
# Keep the existing Metal backend while fixing block's uninhabited FFI static.
block = { path = "vendor/block" }
epaint = { path = "vendor/epaint" }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
wgpu = { version = "24.0.5", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
trash = { version = "=5.2.8", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
eframe = { version = "=0.31.1", default-features = false, features = ["android-native-activity"] }
