name: Windows Store package

on:
  workflow_dispatch:
    inputs:
      development:
        description: Use a development identity (not uploadable to Store)
        type: boolean
        default: true
      version:
        description: Four-part version ending in .0 (blank uses Cargo version)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: always
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_IDENTITY_PUBLISHER: ${{ vars.STORE_IDENTITY_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
      PACKAGE_VERSION: ${{ inputs.version }}
      DEVELOPMENT_PACKAGE: ${{ inputs.development }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'C:/Program Files/NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate packaging inputs
        run: python build/test-package-msix.py
      - name: Build, test and package
        shell: pwsh
        run: |
          $options = @{ Python = 'python' }
          if ($env:PACKAGE_VERSION) { $options.Version = $env:PACKAGE_VERSION }
          if ($env:DEVELOPMENT_PACKAGE -eq 'true') {
            $options.Development = $true
          } else {
            foreach ($key in @('STORE_IDENTITY_NAME', 'STORE_IDENTITY_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME', 'STORE_DISPLAY_NAME')) {
              if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Set repository variable $key from Partner Center." }
            }
            New-Item -ItemType Directory -Force target | Out-Null
            @{
              name = $env:STORE_IDENTITY_NAME
              publisher = $env:STORE_IDENTITY_PUBLISHER
              publisher_display_name = $env:STORE_PUBLISHER_DISPLAY_NAME
              display_name = $env:STORE_DISPLAY_NAME
            } | ConvertTo-Json | Set-Content target/store-identity.json -Encoding utf8
            $options.IdentityConfig = 'target/store-identity.json'
          }
          ./build/windows-store.ps1 @options
      - uses: actions/upload-artifact@v4
        with:
          name: nabi-view-windows-x64-msix
          path: |
            target/msix/**/*.msix
            target/msix/**/*.sha256
          if-no-files-found: error
